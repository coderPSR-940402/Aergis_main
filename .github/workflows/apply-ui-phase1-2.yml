name: Apply approved UI Phase 1-2

on:
  push:
    branches: [ ui-phase1-2 ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ui-phase1-2
          fetch-depth: 0

      - name: Apply exact approved patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase1-2.part1 .github/phase1-2.part2 .github/phase1-2.part3 .github/phase1-2.part4 .github/phase1-2.part5 > /tmp/aergis-ui-phase1-2.b64
          base64 -d /tmp/aergis-ui-phase1-2.b64 > /tmp/aergis-ui-phase1-2.patch
          echo 'b166103fddefd2dcfa865d35a645d697758f66da74fb06ee0968588b67c0aeaf  /tmp/aergis-ui-phase1-2.patch' | sha256sum -c -
          EXCLUDE='app/src/test/java/com/airgesture/control/ui/AergisDestinationTest.kt'
          git apply --check --exclude="$EXCLUDE" /tmp/aergis-ui-phase1-2.patch
          git apply --exclude="$EXCLUDE" /tmp/aergis-ui-phase1-2.patch
          rm -f .github/phase1-2.part1 .github/phase1-2.part2 .github/phase1-2.part3 .github/phase1-2.part4 .github/phase1-2.part5 .github/workflows/apply-ui-phase1-2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ui: implement phase 1-2 navigation and controls'
          git push origin HEAD:ui-phase1-2
