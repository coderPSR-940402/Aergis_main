name: DevLoop runtime wiring

on:
  push:
    branches:
      - feat/aergis-devloop
    paths:
      - .github/workflows/devloop-runtime-wire.yml

permissions:
  contents: write

jobs:
  wire-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply observer-only runtime hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('app/src/main/java/com/airgesture/control/AirRuntime.kt')
          text = runtime.read_text()
          old = '''    internal fun recordActionFeedback(outcome: ActionDispatchOutcome, id: Long) {
              recordActionTelemetry(outcome, id)
              _state.update { current -> current.copy(actionFeedback = current.actionFeedback?.result(id, outcome,
                  android.os.SystemClock.uptimeMillis())) }
          }
          '''
          new = '''    internal fun recordActionFeedback(outcome: ActionDispatchOutcome, id: Long) {
              val now = android.os.SystemClock.uptimeMillis()
              recordActionTelemetry(outcome, id)
              AergisDevLoop.recordActionOutcome(outcome, id, now)
              _state.update { current ->
                  current.copy(actionFeedback = current.actionFeedback?.result(id, outcome, now))
              }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'AirRuntime hook anchor count was {text.count(old)}, expected 1')
          runtime.write_text(text.replace(old, new, 1))

          service = Path('app/src/main/java/com/airgesture/control/AirAccessibilityService.kt')
          text = service.read_text()
          old = '''        val feedbackId = AirRuntime.beginActionFeedback(action)
              fun recordOutcome(outcome: ActionDispatchOutcome) = AirRuntime.recordActionFeedback(outcome, feedbackId)
              val requestedHotspot = visibleHotspot
          '''
          new = '''        val feedbackId = AirRuntime.beginActionFeedback(action)
              fun recordOutcome(outcome: ActionDispatchOutcome) = AirRuntime.recordActionFeedback(outcome, feedbackId)
              val requestedHotspot = visibleHotspot
              val diagnosticTarget = requestedHotspot
                  ?.takeIf { action.usesPointerTouch && it.epoch == expectedEpoch }
                  ?.point
              val runtimeSnapshot = AirRuntime.state.value
              AergisDevLoop.openAction(
                  requestId = feedbackId,
                  openedUptimeMs = SystemClock.uptimeMillis(),
                  action = action.name,
                  frozenTargetX = diagnosticTarget?.x ?: Float.NaN,
                  frozenTargetY = diagnosticTarget?.y ?: Float.NaN,
                  sessionEpoch = expectedEpoch,
                  inputEpoch = runtimeSnapshot.inputEpoch
              )
          '''
          if text.count(old) != 1:
              raise SystemExit(f'AirAccessibilityService hook anchor count was {text.count(old)}, expected 1')
          service.write_text(text.replace(old, new, 1))
          PY
      - name: Commit runtime wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No runtime wiring changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/airgesture/control/AirRuntime.kt app/src/main/java/com/airgesture/control/AirAccessibilityService.kt
          git commit -m 'feat(devloop): wire runtime action correlation'
          git push origin HEAD:${{ github.ref_name }}
