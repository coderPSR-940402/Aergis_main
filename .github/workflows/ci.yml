name: Aergis CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aergis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Aergis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" --licenses <<'EOF'

y
y
y
y
y
y
y
y
y
EOF

          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

          test -d "${ANDROID_HOME}/platforms/android-36"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Verify Gradle configuration
        run: gradle --version

      - name: Run unit tests
        run: gradle test --stacktrace --warning-mode all

      - name: Run Android lint
        run: gradle :app:lint --stacktrace --warning-mode all

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"

          test -s "$APK"
          "$AAPT" dump badging "$APK" > apk-badging.txt

          grep -q "package: name='com.airgesture.control'" apk-badging.txt
          grep -q "versionCode='10'" apk-badging.txt
          grep -q "versionName='0.10.0-preview'" apk-badging.txt

          echo "APK verification passed"
          cat apk-badging.txt

      - name: Generate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Aergis-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aergis-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
