name: Aergis CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aergis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Aergis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Android SDK 37
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0
          key: android-sdk-37

      - name: Prepare Android SDK 37
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"
          test -d "${ANDROID_HOME}/platforms/android-37"
          test -x "${ANDROID_HOME}/build-tools/36.0.0/aapt"

      - name: Set up Gradle wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify Gradle configuration
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew test --build-cache --stacktrace --warning-mode all

      - name: Run Android lint
        run: ./gradlew :app:lint --build-cache --stacktrace --warning-mode all

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --build-cache --stacktrace --warning-mode all

      - name: Assemble minified release APK
        run: ./gradlew :app:assembleRelease --build-cache --stacktrace --warning-mode all

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$AAPT" dump badging "$APK" > apk-badging.txt
          grep -q "package: name='com.airgesture.control'" apk-badging.txt
          grep -q "versionCode='10'" apk-badging.txt
          grep -q "versionName='0.10.0-preview'" apk-badging.txt
          echo "Debug APK verification passed"

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          echo "Release APK verification passed"

      - name: Generate APK checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk | tee apk-sha256.txt

      - name: Generate baseline metadata
        shell: bash
        run: |
          set -euo pipefail
          cat > baseline.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "run_id": ${{ github.run_id }},
            "run_number": ${{ github.run_number }},
            "run_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "baseline_ref": "baseline-successful-apk",
            "generated_at": "${{ github.run_started_at }}"
          }
          EOF
          test -s baseline.json
          cat baseline.json

      - name: Upload APKs and baseline metadata
        uses: actions/upload-artifact@v4
        with:
          name: Aergis-apks-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            apk-sha256.txt
            baseline.json
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aergis-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore

  update-baseline:
    name: Advance successful APK baseline
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Advance baseline without moving backwards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            refs/heads/baseline-successful-apk:refs/remotes/origin/baseline-successful-apk
          BASELINE_SHA="$(git rev-parse refs/remotes/origin/baseline-successful-apk)"
          CURRENT_SHA="${{ github.sha }}"

          if [ "$BASELINE_SHA" = "$CURRENT_SHA" ]; then
            echo "Baseline already points to successful commit $CURRENT_SHA."
            exit 0
          fi
          if git merge-base --is-ancestor "$BASELINE_SHA" "$CURRENT_SHA"; then
            echo "Advancing baseline: $BASELINE_SHA -> $CURRENT_SHA"
            git push origin "$CURRENT_SHA:refs/heads/baseline-successful-apk"
            exit 0
          fi
          if git merge-base --is-ancestor "$CURRENT_SHA" "$BASELINE_SHA"; then
            echo "ERROR: baseline-successful-apk points to a newer successful commit ($BASELINE_SHA)."
          else
            echo "ERROR: baseline-successful-apk has diverged from $CURRENT_SHA."
          fi
          exit 1
