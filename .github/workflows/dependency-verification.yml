name: Prepare dependency verification metadata

# Bootstrap/update only. Review the artifact before committing it; never
# regenerate trusted checksums automatically during normal CI verification.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true

      - name: Resolve dependencies used by all CI tasks
        run: >-
          ./gradlew --write-verification-metadata sha256
          test :app:lint :app:assembleDebug :app:assembleRelease
          --no-build-cache --rerun-tasks --stacktrace

      - name: Upload candidate metadata for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-verification-candidate-${{ github.sha }}
          path: gradle/verification-metadata.xml
          if-no-files-found: error
